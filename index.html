<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapas-Tesis</title>
  <meta name="description" content="Generador de mapas para tesis: interpreta el tema y la geografía del sitio, propone estilos, prepara la figura para impresión, proyector, videollamada o web, y construye mapas de interpretación sobre planos históricos con versiones. Capas del IGN, ARBA y el Atlas de Mensuras de Giles.">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Source+Sans+3:ital,wght@0,400;0,700;1,400;1,700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Roboto+Condensed:ital,wght@0,400;0,700;1,400;1,700&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=EB+Garamond:ital,wght@0,400;0,700;1,400;1,700&family=IM+Fell+English:ital@0;1&display=swap">
  <link rel="stylesheet" href="assets/ol.css">
  <link rel="stylesheet" href="assets/app.css?v=423db185bd">
</head>
<body class="on-home">
  <div id="home" class="home" aria-live="polite"></div>
  <div id="app" hidden>
    <header class="topbar">
      <button type="button" class="icon panel-toggle" data-toggle-panel="left" aria-label="Mostrar u ocultar el panel de capas">☰</button>
      <a class="brand" href="#/" aria-label="Mapas-Tesis: volver a los proyectos" title="Volver a los proyectos">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M4 23c5-1 8-4 12-4s7 3 12 2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 17c4-.6 7-2.6 11-2.6S22 17 28 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="2.2 1.6" opacity=".8"/><path d="M5 27h22" stroke="currentColor" stroke-width="1.2" opacity=".55"/><rect x="9" y="5" width="11" height="8" fill="none" stroke="#e8501c" stroke-width="1.6" transform="rotate(-8 14.5 9)"/><circle cx="23.5" cy="8" r="1.6" fill="#e8501c"/></svg>
        <span class="wordmark">Mapas-Tesis</span>
      </a>
      <nav class="crumbs" id="project-crumb" aria-label="Proyecto y mapa"></nav>
      <input id="title" class="title-input" type="text" aria-label="Nombre del mapa" title="Nombre del mapa (se puede cambiar)" spellcheck="false">
      <span id="save-state" class="save-state" aria-live="polite">Guardado</span>
      <div class="search-wrap" role="search">
        <input id="place-search" type="search" placeholder="Buscar lugar o coordenadas…" aria-label="Buscar un lugar o coordenadas" aria-controls="place-results" aria-expanded="false" autocomplete="off" spellcheck="false">
        <button type="button" id="place-go" class="icon" aria-label="Buscar">⌕</button>
        <ul id="place-results" class="place-results" role="listbox" hidden></ul>
      </div>
      <div class="topbar-tools">
        <label class="tb-field"><span>Proyección</span><select id="projection" aria-label="Proyección del mapa"></select></label>
        <div class="tb-group" role="group" aria-label="Historial">
          <button type="button" id="btn-undo" class="icon" title="Deshacer (Ctrl+Z)" aria-label="Deshacer">↶</button>
          <button type="button" id="btn-redo" class="icon" title="Rehacer (Ctrl+Mayús+Z)" aria-label="Rehacer">↷</button>
        </div>
        <div class="menu-wrap">
          <button type="button" id="btn-project" class="btn ghost" aria-haspopup="true" aria-expanded="false">Proyecto</button>
          <div id="project-menu" class="menu" role="menu" hidden>
            <span class="menu-label">Se guarda solo en esta computadora mientras trabajás</span>
            <button type="button" role="menuitem" data-act="meta">Datos del proyecto…</button>
            <button type="button" role="menuitem" data-act="new-map">Nuevo mapa en este proyecto…</button>
            <hr>
            <button type="button" role="menuitem" data-act="save">Exportar el proyecto completo, con planos (.json)</button>
            <button type="button" role="menuitem" data-act="save-map">Exportar solo este mapa (.json)</button>
            <button type="button" role="menuitem" data-act="open">Importar un proyecto o un mapa…</button>
            <hr>
            <button type="button" role="menuitem" data-act="sites-csv">Descargar sitios (CSV)</button>
            <button type="button" role="menuitem" data-act="sites-geojson">Descargar sitios (GeoJSON)</button>
            <hr>
            <span class="menu-label">Nuevo mapa desde un modelo</span>
            <div class="menu-templates" data-templates></div>
            <hr>
            <button type="button" role="menuitem" data-act="home">Volver a los proyectos</button>
          </div>
          <input type="file" id="open-project" accept=".json,application/json" hidden>
        </div>
        <button type="button" id="btn-export" class="btn primary">Exportar figura</button>
      </div>
    </header>

    <aside class="panel left" id="left" aria-label="Capas, sitios y figura">
      <nav class="tabs" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="tesis" aria-selected="true">Tesis</button>
        <button type="button" class="tab" role="tab" data-tab="capas" aria-selected="false">Capas</button>
        <button type="button" class="tab" role="tab" data-tab="sitios" aria-selected="false">Sitios</button>
        <button type="button" class="tab" role="tab" data-tab="analisis" aria-selected="false">Análisis</button>
        <button type="button" class="tab" role="tab" data-tab="interp" aria-selected="false">Interpretación</button>
        <button type="button" class="tab" role="tab" data-tab="figura" aria-selected="false">Figura</button>
      </nav>
      <div class="panel-body" id="left-body"></div>
    </aside>

    <main class="stage" id="stage">
      <div class="pasteboard" id="pasteboard">
        <div class="paper" id="paper">
          <div id="map-main" class="map-main"></div>
          <canvas id="overlay" class="overlay" aria-hidden="true"></canvas>
        </div>
      </div>
      <footer class="statusbar" id="statusbar">
        <span class="st-cell coord" data-k="coord"></span>
        <span class="st-cell"><span class="st-k">Escala</span> <span data-k="scale">—</span></span>
        <span class="st-cell" data-k="proj"></span>
        <span class="st-cell" data-k="size"></span>
        <span class="st-cell load" data-k="load" aria-live="polite"></span>
        <span class="st-zoom" role="group" aria-label="Zoom de la vista previa">
          <button type="button" class="icon" data-zoom="out" aria-label="Alejar la vista previa">−</button>
          <button type="button" class="btn small ghost" data-zoom="fit">Ajustar</button>
          <button type="button" class="icon" data-zoom="in" aria-label="Acercar la vista previa">+</button>
        </span>
      </footer>
    </main>

    <aside class="panel right" id="inspector" aria-label="Edición del elemento seleccionado">
      <div class="panel-body" id="inspector-body"></div>
    </aside>
  </div>

  <dialog id="export-dialog" aria-labelledby="export-title">
    <form method="dialog" class="dlg">
      <h2 id="export-title">Exportar figura</h2>
      <div class="dlg-body"></div>
    </form>
  </dialog>

  <dialog id="georef-dialog" class="georef-dialog" aria-labelledby="georef-title">
    <div class="gr-body"></div>
  </dialog>

  <dialog id="app-dialog" class="app-dialog" aria-labelledby="app-dialog-title">
    <div class="dlg"><h2 class="dlg-title" id="app-dialog-title"></h2><div class="dlg-body"></div></div>
  </dialog>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <!-- simulación de daltonismo (Machado, Oliveira y Fernandes, 2009) -->
    <filter id="cvd-deutan" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.011820 0.042940 0.968881 0 0  0 0 0 1 0"/></filter>
    <filter id="cvd-protan" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0"/></filter>
    <filter id="cvd-tritan" color-interpolation-filters="linearRGB"><feColorMatrix type="matrix" values="1.255528 -0.076749 -0.178779 0 0  -0.078411 0.930809 0.147602 0 0  0.004733 0.691367 0.303900 0 0  0 0 0 1 0"/></filter>
  </svg>

  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="assets/app.js?v=423db185bd"></script>
</body>
</html>
